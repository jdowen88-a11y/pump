name = "pump-sniper-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database for persistent storage (users, trades, strategies, positions, etc.)
[[d1_databases]]
binding = "DB"
database_name = "pump-sniper-db"
database_id = "your-d1-database-id-here"

# KV for hot cache, rate limiting, sessions, token metadata
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id-here"

# Queues for reliable async trade execution, notifications, backtests
[[queues.producers]]
queue = "trade-execution"
binding = "TRADE_QUEUE"

[[queues.consumers]]
queue = "trade-execution"
max_batch_size = 5
max_batch_timeout = 30
max_concurrency = 1

# Durable Objects for stateful per-user strategy runners / persistent WebSocket connections
[[durable_objects.bindings]]
name = "STRATEGY_RUNNER"
class_name = "StrategyRunner"

# Observability
[observability]
enabled = true
head_sampling_rate = 1

[env.production]
routes = [
  { pattern = "api.sniper.yourdomain.com/*", zone_name = "yourdomain.com" }
]

[env.production.vars]
JWT_SECRET = "your-production-jwt-secret-min-32-chars-change-me"
SOLANA_RPC_URL = "https://mainnet.helius-rpc.com/?api-key=your-helius-key"
HELIUS_API_KEY = "your-helius-api-key"
BIRDEYE_API_KEY = "your-birdeye-api-key"
JITO_RPC_URL = "https://mainnet.block-engine.jito.wtf/api/v1"
ENVIRONMENT = "production"
TELEGRAM_BOT_TOKEN = "your-telegram-bot-token-optional"

# For local dev overrides
[env.local.vars]
ENVIRONMENT = "development"
